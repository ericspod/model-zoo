[tool.black]
line-length = 120
target-version = ['py310']
skip-magic-trailing-comma = true
include = '\.pyi?$'
exclude = '''
(
  /(
    # exclude a few common directories in the root of the project
      \.eggs
    | \.git
    | \.hg
    | \.tox
    | \.venv
    | \.mypy_cache
    | \.pytype
    | venv
    | _build
    | buck-out
    | build
    | dist
  )
)
'''

[tool.isort]
known_first_party = ["models"]
profile = "black"
line_length = 120
skip = [".git", ".eggs", "venv", ".venv"]
skip_glob = ["*.pyi"]
append_only = true

[tool.ruff.lint.mccabe]
max-complexity = 50  # todo lower this treshold when yesqa id replaced with Ruff's RUF100
